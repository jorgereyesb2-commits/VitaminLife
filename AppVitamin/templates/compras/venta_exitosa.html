<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Exitosa</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}"> <!-- Asegúrate de tener Bootstrap o tu estilo preferido -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
            padding: 30px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .total {
            font-size: 1.5rem;
            color: #28a745; /* Verde para el total */
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h2 class="fw-bolder">¡Gracias por tu compra!</h2>
        <p class="lead">Tu número de orden es: <strong>{{ venta.venta_id }}</strong></p>
        <p class="lead total">Total pagado: <strong>${{ venta.total }}</strong></p>
        <a href="{% url 'nombre_de_tu_vista_principal' %}" class="btn btn-primary mt-3">Volver a la tienda</a>
    </div>
</body>
</html>
